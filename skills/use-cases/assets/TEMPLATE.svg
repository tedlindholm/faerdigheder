<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title">
  <title id="title">Wireframe template: a screen with a list on the left and a settings panel open on the right</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #333; font-size: 13px; }
    .frame { fill: #fff; stroke: #999; stroke-width: 1.5; }
    .shade { fill: #e9e9e9; }
    .box { fill: #fff; stroke: #aaa; }
    .grey { fill: #f2f2f2; stroke: #bbb; }
    .muted { fill: #888; }
    .on { fill: #555; }
    .note { fill: #b3261e; font-size: 13px; }
    .callout { stroke: #b3261e; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  </style>

  <!-- The screen behind the panel: replace with what the user sees there. -->
  <rect class="frame" x="10" y="10" width="800" height="400" rx="8"/>
  <rect class="shade" x="11" y="11" width="250" height="398" rx="7"/>
  <text x="28" y="40" font-size="15" font-weight="600">Screen title</text>
  <rect class="grey" x="28" y="60" width="216" height="124" rx="4"/>
  <text x="40" y="82" font-weight="600">Item name</text>
  <rect class="box" x="40" y="92" width="194" height="50" rx="3"/>
  <text x="46" y="121" font-size="11">Summary as the screen writes it</text>
  <text class="muted" x="40" y="168" font-size="12">Secondary text…</text>

  <!-- The panel: use the real heading and labels. -->
  <rect class="frame" x="262" y="11" width="547" height="398"/>
  <text x="282" y="42" font-size="16" font-weight="600">Panel heading</text>
  <line x1="262" y1="58" x2="809" y2="58" stroke="#ccc"/>

  <text x="282" y="188" font-weight="600">Setting</text>
  <rect class="on" x="430" y="176" width="34" height="18" rx="9"/>
  <circle cx="455" cy="185" r="6" fill="#fff"/>
  <text x="472" y="190">On</text>

  <rect class="box" x="430" y="208" width="80" height="24" rx="3"/>
  <text x="438" y="224">Choice ▾</text>
  <text x="518" y="224">label text</text>

  <rect class="box" x="430" y="244" width="104" height="26" rx="3"/>
  <text x="438" y="261">field ▾</text>
  <rect class="box" x="542" y="244" width="70" height="26" rx="3"/>
  <text x="550" y="261">option ▾</text>
  <rect class="box" x="620" y="244" width="110" height="26" rx="3"/>
  <text x="628" y="261" font-family="ui-monospace, Menlo, monospace">value</text>

  <rect class="on" x="720" y="364" width="70" height="28" rx="3"/>
  <text x="755" y="383" text-anchor="middle" style="fill:#fff">Save</text>
  <text x="680" y="383" text-anchor="middle">Close</text>

  <!-- Annotation: point at what the use case is about. -->
  <rect class="callout" x="422" y="236" width="376" height="42" rx="6"/>
  <text class="note" x="282" y="256">What this use</text>
  <text class="note" x="282" y="274">case is about</text>
</svg>
