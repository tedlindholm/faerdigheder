<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="660" viewBox="0 0 1480 660" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <title id="title">Wireframe template for a window with a table and detail area</title>
  <desc id="description">A light desktop window with a toolbar, a table of example rows, a detail area, a status line and a red dashed callout pointing to the first row. Replace the example labels and values with fictional data from the screen being described.</desc>

  <defs>
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="20" y="20" width="960" height="610" rx="12"/>
    </clipPath>
    <clipPath id="table-clip">
      <rect x="36" y="96" width="928" height="338" rx="6"/>
    </clipPath>
  </defs>

  <style>
    .text { fill: #222; font-size: 13px; }
    .muted { fill: #888; font-size: 13px; }
    .small { font-size: 11px; }
    .heading { font-size: 14px; font-weight: 600; }
    .grid { stroke: #e2e2e2; }
    .callout { fill: none; stroke: #d95b54; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .note { fill: #c94f48; font-size: 13px; }
  </style>

  <rect width="1480" height="660" fill="#e9ecf2"/>

  <!-- Window frame and toolbar -->
  <g filter="url(#window-shadow)">
    <rect x="20" y="20" width="960" height="610" rx="12" fill="#fff" stroke="#c9ccd2"/>
  </g>
  <g clip-path="url(#window-clip)">
    <rect x="20" y="20" width="960" height="56" fill="#f6f6f6"/>
    <line x1="20" y1="76" x2="980" y2="76" stroke="#dcdcdc"/>
    <circle cx="42" cy="48" r="6.5" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="62" cy="48" r="6.5" fill="#febc2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="82" cy="48" r="6.5" fill="#28c840" stroke="#1aab29" stroke-width="0.5"/>
    <text class="text heading" x="106" y="53">App name</text>

    <!-- Replace these controls with the real toolbar labels. -->
    <g class="text" text-anchor="middle">
      <rect x="550" y="34" width="180" height="28" rx="14" fill="#fff" stroke="#d4d4d4"/>
      <text x="628" y="52">Library ▾</text>
      <rect x="742" y="34" width="104" height="28" rx="14" fill="#fff" stroke="#d4d4d4"/>
      <text x="794" y="52">Action</text>
      <rect x="858" y="34" width="104" height="28" rx="14" fill="#fff" stroke="#d4d4d4"/>
      <text x="910" y="52">Refresh</text>
    </g>

    <!-- Table: edit headings, rows, and column positions to match the screen. -->
    <rect x="36" y="96" width="928" height="338" rx="6" fill="#fff" stroke="#d4d4d4"/>
    <g clip-path="url(#table-clip)">
      <rect x="36" y="96" width="928" height="38" fill="#f6f6f6"/>
      <line x1="36" y1="134" x2="964" y2="134" stroke="#d4d4d4"/>
      <g class="grid">
        <line x1="220" y1="96" x2="220" y2="434"/>
        <line x1="348" y1="96" x2="348" y2="434"/>
        <line x1="618" y1="96" x2="618" y2="434"/>
        <line x1="748" y1="96" x2="748" y2="434"/>
        <line x1="856" y1="96" x2="856" y2="434"/>
      </g>
      <g class="text heading">
        <text x="50" y="120">Project</text>
        <text x="234" y="120">Type</text>
        <text x="362" y="120">Title</text>
        <text x="632" y="120">Updated</text>
        <text x="762" y="120">Status</text>
        <text x="870" y="120">ID</text>
      </g>
      <rect x="37" y="135" width="926" height="28" fill="#f4f5f7"/>
      <rect x="37" y="191" width="926" height="28" fill="#f4f5f7"/>
      <rect x="37" y="247" width="926" height="28" fill="#f4f5f7"/>
      <g class="text">
        <text x="50" y="154">sample-project</text>
        <text x="234" y="154">Example</text>
        <text x="362" y="154">Review the parser</text>
        <text x="632" y="154">23 Nov 2026</text>
        <text x="762" y="154">Ready</text>
        <text x="870" y="154" font-family="'SF Mono', Menlo, monospace" font-size="11">00000000…</text>

        <text x="50" y="182">sample-project</text>
        <text x="234" y="182">Example</text>
        <text x="362" y="182">Add a test fixture</text>
        <text x="632" y="182">22 Nov 2026</text>
        <text x="762" y="182">Draft</text>
        <text x="870" y="182" font-family="'SF Mono', Menlo, monospace" font-size="11">00000000…</text>

        <text x="50" y="210">example-site</text>
        <text x="234" y="210">Example</text>
        <text x="362" y="210">Check the empty state</text>
        <text x="632" y="210">21 Nov 2026</text>
        <text x="762" y="210">Ready</text>
        <text x="870" y="210" font-family="'SF Mono', Menlo, monospace" font-size="11">00000000…</text>

        <text x="50" y="238">sample-project</text>
        <text x="234" y="238">Example</text>
        <text x="362" y="238">Open the welcome page</text>
        <text x="632" y="238">20 Nov 2026</text>
        <text x="762" y="238">Done</text>
        <text x="870" y="238" font-family="'SF Mono', Menlo, monospace" font-size="11">00000000…</text>
      </g>
    </g>
    <rect class="callout" x="36" y="135" width="928" height="28" rx="4"/>

    <!-- Detail area and status line -->
    <line x1="36" y1="452" x2="964" y2="452" stroke="#d4d4d4"/>
    <text class="text heading" x="46" y="482">Details</text>
    <text class="muted" x="46" y="510">Select a row to see its details.</text>
    <text class="muted small" x="36" y="596">4 items in Example</text>
  </g>

  <!-- Point to the behaviour this use case describes. -->
  <g>
    <rect x="1004" y="54" width="260" height="72" rx="8" fill="#fff" stroke="#d95b54" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="note" x="1018" y="82">Describe what happens</text>
    <text class="note" x="1018" y="102">when this row is used.</text>
    <path class="callout" d="M1004 108 H982 V149 H964"/>
  </g>
</svg>
